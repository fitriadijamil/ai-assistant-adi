services:
  - type: web
    name: ai-assistant-adi-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DATABASE_URL
        value: sqlite:///./adi.db
      - key: CORS_ORIGINS
        value: '["https://ai.adicctv.com", "https://frontend-au2z57f24-adijamil-s-projects.vercel.app", "http://localhost:3000"]'
      - key: PYTHON_VERSION
        value: 3.12.0
